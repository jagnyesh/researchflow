# Streamlit Configuration for ResearchFlow
# Forces light theme across all apps

[theme]
# Primary color (blue for buttons, links)
primaryColor = "#007AFF"

# Main background color (white)
backgroundColor = "#FFFFFF"

# Secondary background (light gray for sidebars, cards)
secondaryBackgroundColor = "#F5F7FA"

# Text color (dark gray)
textColor = "#1D1D1F"

# Font family
font = "sans serif"

[server]
# Streamlit's default listens on every interface, and the dashboards have no
# auth (#39); loopback keeps them off the LAN for every launch command (#208).
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true

[browser]
# Disable dark mode detection
gatherUsageStats = false
